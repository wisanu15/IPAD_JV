<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F7EF7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iPad JV">
  <title>iPad JV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4ff;
      color: #0f172a;
      overflow: hidden;
    }
    .app-shell {
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #f0f4ff;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f0f4ff;
    }
    .setup {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
    }
    .setup-panel {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid #dbe4ff;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
    }
    .setup-panel h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }
    .setup-panel p {
      margin: 0 0 14px;
      color: #475569;
      line-height: 1.55;
    }
    code {
      display: block;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="app-shell" id="appShell" aria-label="iPad JV"></main>

  <script src="./config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var configuredUrl = (window.IPAD_JV_CONFIG && window.IPAD_JV_CONFIG.GAS_WEB_APP_URL || '').trim();
      var gasUrl = (params.get('gas') || configuredUrl).trim();
      var shell = document.getElementById('appShell');

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }

      if (!gasUrl) {
        shell.innerHTML =
          '<section class="setup">' +
            '<div class="setup-panel">' +
              '<h1>ตั้งค่า URL ของ GAS ก่อนใช้งาน</h1>' +
              '<p>ใส่ Web App URL ที่ deploy แล้วในไฟล์ <strong>docs/config.js</strong> หรือทดสอบด้วย query parameter:</p>' +
              '<code>?gas=https://script.google.com/macros/s/DEPLOYMENT_ID/exec</code>' +
            '</div>' +
          '</section>';
        return;
      }

      var iframe = document.createElement('iframe');
      iframe.title = 'ระบบบริหารจัดการไอแพด';
      iframe.src = gasUrl;
      iframe.referrerPolicy = 'no-referrer-when-downgrade';
      iframe.allow = 'clipboard-read; clipboard-write; fullscreen';
      shell.appendChild(iframe);
    }());
  </script>
</body>
</html>
