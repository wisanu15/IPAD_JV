<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F7EF7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iPad JV">
  <meta name="format-detection" content="telephone=no">
  <title>iPad JV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4ff;
      color: #0f172a;
      overflow: hidden;
    }
    .app-shell {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 0%, rgba(79, 126, 247, .16), transparent 34%),
        #f0f4ff;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f0f4ff;
    }
    .fallback-bar {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(79, 126, 247, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 10px 28px rgba(15, 23, 42, .16);
      backdrop-filter: blur(10px);
    }
    .fallback-bar span {
      min-width: 0;
      font-size: 13px;
      line-height: 1.35;
      color: #334155;
    }
    .fallback-bar a {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 7px;
      background: #4F7EF7;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .setup {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
    }
    .setup-panel {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid #dbe4ff;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
    }
    .launch-card {
      width: min(460px, 100%);
      padding: 26px 22px;
      border: 1px solid #dbe4ff;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
      text-align: center;
    }
    .launch-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(79, 126, 247, .24);
    }
    .launch-card h1 {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.25;
    }
    .launch-card p {
      margin: 0 auto 18px;
      color: #475569;
      line-height: 1.55;
    }
    .launch-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 8px;
      background: #4F7EF7;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
    }
    .launch-button.secondary {
      margin-top: 10px;
      background: #e8eefc;
      color: #27468f;
    }
    .launch-note {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }
    .platform-steps {
      margin: 18px 0 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
    }
    .platform-steps strong {
      color: #0f172a;
    }
    .setup-panel h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }
    .setup-panel p {
      margin: 0 0 14px;
      color: #475569;
      line-height: 1.55;
    }
    code {
      display: block;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="app-shell" id="appShell" aria-label="iPad JV"></main>

  <script src="./config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var configuredUrl = (window.IPAD_JV_CONFIG && window.IPAD_JV_CONFIG.GAS_WEB_APP_URL || '').trim();
      var gasUrl = (params.get('gas') || configuredUrl).trim();
      var shell = document.getElementById('appShell');

      if (!gasUrl) {
        shell.innerHTML =
          '<section class="setup">' +
            '<div class="setup-panel">' +
              '<h1>ตั้งค่า URL ของ GAS ก่อนใช้งาน</h1>' +
              '<p>ใส่ Web App URL ที่ deploy แล้วในไฟล์ <strong>docs/config.js</strong> หรือทดสอบด้วย query parameter:</p>' +
              '<code>?gas=https://script.google.com/macros/s/DEPLOYMENT_ID/exec</code>' +
            '</div>' +
          '</section>';
        return;
      }

      var forceOpen = params.get('open') === '1';
      var forceEmbed = params.get('embed') === '1';
      var userAgent = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(userAgent);
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }

      if (forceOpen) {
        window.location.replace(gasUrl);
        return;
      }

      if (((isIOS || isAndroid) && isStandalone) || forceEmbed) {
        shell.style.padding = '0';
        shell.style.display = 'block';
        var iframe = document.createElement('iframe');
        iframe.title = 'ระบบบริหารจัดการไอแพด';
        iframe.src = gasUrl;
        iframe.referrerPolicy = 'no-referrer-when-downgrade';
        iframe.allow = 'clipboard-read; clipboard-write; fullscreen';
        shell.appendChild(iframe);
        return;
      }

      var chromeIntentUrl = 'intent://' +
        gasUrl.replace(/^https?:\/\//, '') +
        '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
        encodeURIComponent(gasUrl) +
        ';end';
      var androidEmbedUrl = './index.html?embed=1&v=android-fullscreen-1';
      var primaryUrl = isIOS ? gasUrl : androidEmbedUrl;
      var primaryText = isIOS ? 'เปิดระบบบน Safari' : 'ทดสอบเต็มจอ Android';
      var helpText = isIOS ?
        '<div class="platform-steps"><strong>ติดตั้งบน iPhone/iPad:</strong><br>1. เปิดหน้านี้ด้วย Safari<br>2. กดปุ่มแชร์<br>3. เลือก Add to Home Screen หรือ เพิ่มไปยังหน้าจอโฮม<br>4. เปิดไอคอน iPad JV แล้วกดปุ่มเปิดระบบ</div>' :
        '<div class="platform-steps"><strong>ติดตั้งบน Android:</strong><br>เปิดหน้านี้ด้วย Chrome แล้วเลือก Add to Home screen หรือ Install app</div>';
      var noteText = isIOS ?
        'ถ้าเปิดจาก LINE/Facebook แล้วไม่ทำงาน ให้คัดลอกลิงก์นี้ไปเปิดใน Safari โดยตรง' :
        'ถ้าปุ่มทดสอบใช้ได้ ให้กดเมนู Chrome ⋮ แล้วเลือก Install app หรือ Add to Home screen';

      shell.innerHTML =
        '<section class="launch-card">' +
          '<img class="launch-icon" src="./icons/icon-192.png" alt="">' +
          '<h1>iPad JV</h1>' +
          '<p>เปิดระบบบริหารจัดการไอแพดผ่านเบราว์เซอร์หลักของเครื่อง เพื่อให้ Apps Script ทำงานเสถียรที่สุด</p>' +
          '<a class="launch-button" href="' + primaryUrl.replace(/"/g, '&quot;') + '">' + primaryText + '</a>' +
          '<a class="launch-button secondary" target="_blank" rel="noopener" href="' + gasUrl.replace(/"/g, '&quot;') + '">เปิดลิงก์สำรอง</a>' +
          helpText +
          '<div class="launch-note">' + noteText + '</div>' +
        '</section>';
    }());
  </script>
</body>
</html>
